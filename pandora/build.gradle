import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins {
    id "com.android.application"
}

abstract class PreparePayloadTask extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getPayloadFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void Prepare() {
        File Destination = new File(getOutputDirectory().get().asFile, "pandora/payload.apk")
        Destination.parentFile.mkdirs()
        java.nio.file.Files.copy(getPayloadFile().get().asFile.toPath(), Destination.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def MainKeystore = new Properties()
def MainKeystoreFile = rootProject.file("signing/main-keystore.properties")
if (MainKeystoreFile.isFile()) {
    MainKeystoreFile.withInputStream { MainKeystore.load(it) }
}

android {
    namespace "com.pandora.builder"
    compileSdk 37

    defaultConfig {
        applicationId "com.pandora.builder"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        if (MainKeystoreFile.isFile()) {
            main {
                storeFile rootProject.file(MainKeystore["storeFile"])
                storePassword MainKeystore["storePassword"]
                keyAlias MainKeystore["keyAlias"]
                keyPassword MainKeystore["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            if (MainKeystoreFile.isFile()) {
                signingConfig signingConfigs.main
            }
        }
        release {
            minifyEnabled false
            if (MainKeystoreFile.isFile()) {
                signingConfig signingConfigs.main
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def PreparePayload = tasks.register("PreparePayload", PreparePayloadTask) {
    dependsOn(":pandora-core:assembleRelease")
    payloadFile.set(project(":pandora-core").layout.buildDirectory.file(
            "outputs/apk/release/pandora-core-release-unsigned.apk"))
    outputDirectory.set(layout.buildDirectory.dir("generated/payload"))
}

androidComponents {
    onVariants(selector().all()) { Variant ->
        Variant.sources.assets.addGeneratedSourceDirectory(PreparePayload,
                { Task -> Task.outputDirectory })
    }
}

dependencies {
    implementation project(":pandora-slim")
    implementation "io.github.reandroid:ARSCLib:1.4.0"
    implementation "com.github.QWEA0:liquidglass:v2.0.11"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
}
