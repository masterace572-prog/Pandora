name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install Android build packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Build APKs
        run: ./gradlew :pandora:assembleDebug :pandora:assembleRelease --no-daemon

      - name: Validate unsigned release package
        run: |
          set -euo pipefail
          apk=pandora/build/outputs/apk/release/pandora-release-unsigned.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c 4 "$apk"

      - name: Upload built APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pandora-apks
          path: |
            pandora/build/outputs/apk/debug/pandora-debug.apk
            pandora/build/outputs/apk/release/pandora-release-unsigned.apk
          if-no-files-found: error
