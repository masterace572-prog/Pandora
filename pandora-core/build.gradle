plugins {
    id "com.android.application"
}

dependencies {
    implementation project(":pandora-slim")
}

android {
    enableKotlin = false
    namespace "com.pandora.core.payload"
    compileSdk 37
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.pandora.core.payload"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++23"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig null
        }
        release {
            minifyEnabled false
            ndk {
                debugSymbolLevel "FULL"
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
